<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Workspace not found · PrintForge</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f5f1; color: #19201d; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { position: relative; width: min(520px, 100%); padding: 42px; border: 1px solid #dfe4dc; border-radius: 26px; background: white; box-shadow: 0 24px 70px rgba(22, 35, 28, .1); }
      span { color: #315ff4; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 12px 0 10px; font-size: clamp(32px, 8vw, 54px); line-height: .98; }
      p { color: #68716b; line-height: 1.6; }
      a { display: inline-flex; margin-top: 18px; padding: 12px 17px; border-radius: 12px; background: #19201d; color: white; font-weight: 750; text-decoration: none; }
      .not-found-language { position: absolute; inset: 18px 18px auto auto; display: inline-flex; align-items: center; gap: 6px; }
      .not-found-language select { min-height: 34px; border: 1px solid #dfe4dc; border-radius: 9px; background: #f8faf7; color: #19201d; padding: 5px 8px; font: inherit; font-weight: 700; }
      .not-found-language > span { font-size: 16px; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <main>
      <label class="not-found-language" title="Choose language">
        <span aria-hidden="true">🌐</span>
        <select data-language-select aria-label="Choose language">
          <option value="en">English</option>
          <option value="sk">Slovenčina</option>
          <option value="cs">Čeština</option>
          <option value="de">Deutsch</option>
          <option value="pl">Polski</option>
        </select>
      </label>
      <span id="notFoundEyebrow">PrintForge · 404</span>
      <h1 id="notFoundTitle">That workspace does not exist.</h1>
      <p id="notFoundDescription">The link may be incomplete, or the product studio has not been published yet.</p>
      <a id="returnHome" href="/">Return to workspace gallery</a>
    </main>
    <script type="module" src="./404.js?v=20260901-release37"></script>
  </body>
</html>
